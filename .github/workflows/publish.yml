name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate build/auth without publishing"
        type: boolean
        default: true

jobs:
  # ── version guard ─────────────────────────────────────────────────────────────
  check-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set -euo pipefail
          NPM_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          PY_VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          POM_VER=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          TS_VER=$(node -p "require('./tree-sitter.json').metadata.version")
          MAKE_VER=$(grep -m1 '^VERSION' Makefile | sed -E 's/VERSION := (.*)/\1/')
          echo "package.json=$NPM_VER Cargo.toml=$CARGO_VER pyproject.toml=$PY_VER pom.xml=$POM_VER tree-sitter.json=$TS_VER Makefile=$MAKE_VER"
          for v in "$CARGO_VER" "$PY_VER" "$POM_VER" "$TS_VER" "$MAKE_VER"; do
            if [ "$v" != "$NPM_VER" ]; then
              echo "::error::Version mismatch across manifests: package.json=$NPM_VER vs $v"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$NPM_VER" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $NPM_VER"
              exit 1
            fi
          fi

  # ── npm ──────────────────────────────────────────────────────────────────────
  npm:
    name: Publish to npm
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - run: npm publish --provenance --access public${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' --dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── crates.io ────────────────────────────────────────────────────────────────
  crates:
    name: Publish to crates.io
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: cargo publish --allow-dirty${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' --dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── PyPI ─────────────────────────────────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Maven Central ─────────────────────────────────────────────────────────────
  maven:
    name: Publish to Maven Central
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - run: |
          git clone --depth 1 --branch "$TREE_SITTER_REF" "$TREE_SITTER_REPO" /tmp/tree-sitter-core
          cc -shared -fPIC -I/tmp/tree-sitter-core/lib/include -I/tmp/tree-sitter-core/lib/src \
            /tmp/tree-sitter-core/lib/src/lib.c -o libtree-sitter.so
          sudo cp libtree-sitter.so /usr/local/lib/
          make
          sudo cp libtree-sitter-eskip.so /usr/local/lib/
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn --batch-mode deploy -Pci${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' -Dpublish.skip=true' || '' }}
        env:
          CI: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
