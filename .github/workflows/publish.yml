name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate build/auth without publishing"
        type: boolean
        default: true

jobs:
  # ── npm ──────────────────────────────────────────────────────────────────────
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - run: npm publish --provenance --access public${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' --dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── crates.io ────────────────────────────────────────────────────────────────
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - run: cargo publish --allow-dirty${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' --dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── PyPI ─────────────────────────────────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Maven Central ─────────────────────────────────────────────────────────────
  maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - run: tree-sitter generate
      - run: |
          git clone --depth 1 --branch "$TREE_SITTER_REF" "$TREE_SITTER_REPO" /tmp/tree-sitter-core
          cc -shared -fPIC -I/tmp/tree-sitter-core/lib/include -I/tmp/tree-sitter-core/lib/src \
            /tmp/tree-sitter-core/lib/src/lib.c -o libtree-sitter.so
          sudo cp libtree-sitter.so /usr/local/lib/
          make
          sudo cp libtree-sitter-eskip.so /usr/local/lib/
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn --batch-mode deploy -Pci${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ' -Dpublish.skip=true' || '' }}
        env:
          CI: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
