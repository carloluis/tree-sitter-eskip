[package]
name = "tree-sitter-eskip"
description = "A descriptive configuration language designed for routing rules in Skipper"
version = "0.1.0"
authors = ["Carloluis <carloluisr@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "eskip"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/carloluis/tree-sitter-eskip"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
